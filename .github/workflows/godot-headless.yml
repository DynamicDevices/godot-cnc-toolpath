name: Godot headless check

# Non-blocking for Julian: no branch-protection required checks.
# Self-hosted + Godot Docker (Alex). Failures show in Actions; tell group if red.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  headless-bake:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Import + headless bake (Godot Docker)
        run: |
          set -euo pipefail
          IMAGE=ghcr.io/sharkyrawr/godot-docker:4.6
          docker pull "$IMAGE"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src:rw" \
            -w /src \
            --entrypoint "" \
            -e HOME=/tmp \
            -u "$(id -u):$(id -g)" \
            "$IMAGE" \
            bash -lc '
              set -euo pipefail
              godot --version
              godot --headless --path /src --import
              OUT=$(mktemp)
              set +e
              godot --headless --path /src -s res://tools/bake_once.gd 2>&1 | tee "$OUT"
              RC=${PIPESTATUS[0]}
              set -e
              if grep -E "Parse Error|Failed to load script|BAKE_FAIL" "$OUT"; then
                echo "::error::Godot barmesh script/bake failure"
                exit 1
              fi
              grep -q "BAKE_OK strategy=barmesh" "$OUT"
              [ "$RC" -eq 0 ]
              COUT=$(mktemp)
              set +e
              godot --headless --path /src -s res://tools/test_contact.gd 2>&1 | tee "$COUT"
              CRC=${PIPESTATUS[0]}
              set -e
              if grep -E "Parse Error|Failed to load script|CONTACT_FAIL" "$COUT"; then
                echo "::error::Godot contact poka-yoke failure"
                exit 1
              fi
              grep -q "CONTACT_OK" "$COUT"
              [ "$CRC" -eq 0 ]
              QOUT=$(mktemp)
              set +e
              godot --headless --path /src -s res://tools/test_drop_quality.gd 2>&1 | tee "$QOUT"
              QRC=${PIPESTATUS[0]}
              set -e
              if grep -E "Parse Error|Failed to load script|DROP_QUALITY_FAIL" "$QOUT"; then
                echo "::error::Godot drop quality (folded/roof) failure"
                exit 1
              fi
              grep -q "DROP_QUALITY_OK" "$QOUT"
              [ "$QRC" -eq 0 ]
              EOUT=$(mktemp)
              set +e
              godot --headless --path /src -s res://tools/test_eartip_quality.gd 2>&1 | tee "$EOUT"
              ERC=${PIPESTATUS[0]}
              set -e
              if grep -E "Parse Error|Failed to load script|EARTIP_QUALITY_FAIL" "$EOUT"; then
                echo "::error::Godot eartip quality (fall-through) failure"
                exit 1
              fi
              grep -q "EARTIP_QUALITY_OK" "$EOUT"
              [ "$ERC" -eq 0 ]
            '

      - name: Summarize
        if: always()
        run: |
          echo "### Godot CI" >> "$GITHUB_STEP_SUMMARY"
          echo "bake + contact + drop_quality (folded/roof) + **eartip penetration** (\`test_eartip_quality.gd\`)" >> "$GITHUB_STEP_SUMMARY"
          echo "Status: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
