name: Godot headless check

# Non-blocking for Julian: no branch-protection required checks.
# Self-hosted + Godot Docker (Alex). Failures show in Actions; tell group if red.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  headless-bake:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Import + headless bake (Godot Docker)
        run: |
          set -euo pipefail
          IMAGE=ghcr.io/sharkyrawr/godot-docker:4.6
          docker pull "$IMAGE"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src:rw" \
            -w /src \
            --entrypoint "" \
            -e HOME=/tmp \
            -u "$(id -u):$(id -g)" \
            "$IMAGE" \
            bash -lc '
              set -euo pipefail
              godot --version
              godot --headless --path /src --import
              for STRATEGY in raster waterline; do
                OUT=$(mktemp)
                set +e
                godot --headless --path /src -s res://tools/bake_once.gd \
                  -- --strategy="$STRATEGY" 2>&1 | tee "$OUT"
                RC=${PIPESTATUS[0]}
                set -e
                if grep -E "Parse Error|Failed to load script|BAKE_FAIL" "$OUT"; then
                  echo "::error::Godot $STRATEGY script/bake failure"
                  exit 1
                fi
                grep -q "BAKE_OK strategy=$STRATEGY" "$OUT"
                if [ "$STRATEGY" = waterline ]; then
                  grep -q "WATERLINE_PROOF" "$OUT"
                fi
                [ "$RC" -eq 0 ]
              done
            '

      - name: Summarize
        if: always()
        run: |
          echo "### Godot CI" >> "$GITHUB_STEP_SUMMARY"
          echo "Self-hosted Docker image \`ghcr.io/sharkyrawr/godot-docker:4.6\` — raster + waterline headless bakes via \`tools/bake_once.gd\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Status: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
